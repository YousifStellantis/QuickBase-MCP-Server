name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  mcp-inspector:
    name: MCP Inspector (both protocol eras, skills conformance)
    runs-on: ubuntu-latest
    needs: test
    env:
      INSPECTOR: npx -y @modelcontextprotocol/inspector@2.13.0 --cli node build/index.js -e QB_REALM=ci.quickbase.com -e QB_USER_TOKEN=ci_placeholder_not_a_token
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: $INSPECTOR --protocol-era modern --method tools/list --strict > /dev/null
      - run: $INSPECTOR --protocol-era legacy --method tools/list > /dev/null
      - run: $INSPECTOR --protocol-era modern --method skills/list --verify
